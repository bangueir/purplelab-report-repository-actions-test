name: Run Tests

on:
  push:
    branches: [ Dev, main ]
  pull_request:
    branches: [ Dev, main ]

jobs:
  github-structure:
    name: Github Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display Repository Structure
        run: |
          echo "🗂️ Repository Structure After Checkout:"
          echo "📁 Working Directory: $(pwd)"
          echo "📁 Full Path: ${{ github.workspace }}"
          echo ""
          echo "🌳 Directory Tree:"
          tree . || ls -la
          echo ""
          echo "📋 Detailed Structure:"
          find . -type f -name "*.py" -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" | head -20
  test:
    runs-on: ubuntu-latest
    
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Run tests with pytest
      run: |
        pytest test/ -v --cov=src --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false 